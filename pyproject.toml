[project]
name = "expense-analytics-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Anastasiia Matveeva",email = "armatveeva@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["plotly.*", "pandas.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poetry]
package-mode = false